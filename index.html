<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Digimium — Digital subscriptions, simplified</title>
    <meta name="description" content="Buy AI tools, streaming, VPN, and creative subscriptions in Myanmar. Simple ordering via Telegram — no payment forms, no hassle." />
    <link rel="canonical" href="https://buywith-digimium.store/" />

    <!-- Open Graph (Facebook, Telegram link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digimium" />
    <meta property="og:title" content="Digimium — Digital subscriptions, simplified" />
    <meta property="og:description" content="Buy AI tools, streaming, VPN, and creative subscriptions in Myanmar. Simple ordering via Telegram — no payment forms, no hassle." />
    <meta property="og:url" content="https://buywith-digimium.store/" />
    <meta property="og:image" content="https://buywith-digimium.store/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digimium — Digital subscriptions, simplified" />
    <meta name="twitter:description" content="Buy AI tools, streaming, VPN, and creative subscriptions in Myanmar. Simple ordering via Telegram." />
    <meta name="twitter:image" content="https://buywith-digimium.store/og-image.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- JSON-LD: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://buywith-digimium.store/#organization",
          "name": "Digimium",
          "url": "https://buywith-digimium.store",
          "logo": "https://buywith-digimium.store/digimium-logo-blue.png",
          "sameAs": [
            "https://www.facebook.com/profile.php?id=61586643983894",
            "https://t.me/buyheredigimium"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "url": "https://t.me/LynnIsHeree"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://buywith-digimium.store/#website",
          "url": "https://buywith-digimium.store",
          "name": "Digimium",
          "publisher": { "@id": "https://buywith-digimium.store/#organization" }
        }
      ]
    }
    </script>

    <link rel="icon" href="/digimium-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
